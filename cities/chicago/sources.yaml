# Discover, 2026-11-24. All entries are leads found by search or a metadata read; none is archived.
- id: chi-311-service-requests
  name: 311 Service Requests (current feed, dataset v6vf-nfxy)
  publisher: City of Chicago
  source_type: open_data_portal
  url: https://data.cityofchicago.org/api/views/v6vf-nfxy.json
  status: listed
  notes: 'Record-level 311 data. Metadata read in Discover says coverage is 12/18/2018 to present plus some records, with legacy records flagged in LEGACY_RECORD; earliest CREATED_DATE 2018-07-01. A pothole type SR_TYPE "Pothole in Street Complaint" (code PHF) was seen in the portal summary. The type label and its history are unverified. Aggregate-only fetch (grouped counts); never archive rows. Kind: reported_demand.'
- id: chi-311-pot-holes-historical
  name: 311 Service Requests - Pot Holes Reported - Historical (dataset 7as2-ds3y)
  publisher: City of Chicago
  source_type: open_data_portal
  url: https://data.cityofchicago.org/api/views/7as2-ds3y.json
  status: listed
  notes: 'Search results say it covers requests since 2011-01-01 and is listed as updated daily, but a data.gov harvest record says a 2018 311 system change moved this function to another dataset (probably v6vf-nfxy). Fetch must read its metadata for the true end date. Catalog page: https://catalog.data.gov/dataset/311-service-requests-pot-holes-reported-historical. The listing says a request may be marked Completed when no pothole is found and one call can cause several repairs, which belong in caveats. Aggregate-only fetch. Kind: reported_demand.'
- id: chi-perf-metrics-pothole-repair
  name: Performance Metrics - Transportation - Pothole Repair (dataset sbt5-2ec8)
  publisher: City of Chicago
  source_type: open_data_portal
  url: https://catalog.data.gov/dataset/performance-metrics-transportation-pothole-repair
  status: listed
  notes: 'Search results say it tracks average days to complete repairs against a 7-day target and was last modified in 2014, so it is probably historical only. Its id is not registered in scripts/fetch_source.py. Fetch should read the catalog page only unless the portal page confirms it is aggregate data.'
