- id: chi-oig-pavement-management-audit-2015
  name: Inspector General audit of the CDOT pavement management program (December 2015)
  publisher: City of Chicago Office of Inspector General
  source_type: audit
  url: https://devigchicago.igchicago.org/wp-content/uploads/2023/08/CDOT-Pavement-Management-Audit.pdf
  status: listed
  notes: 'Per search summary, says CDOT ran PCI surveys of arterial streets in 2007 and 2014 and never surveyed residential streets, and found data collection and performance measurement deficient. Unread, so none of this is verified. Likely the main condition-method source. Summary page: https://igchicago.org/2015/12/22/audit-of-cdot-pavement-management-program/. The host is a "dev" subdomain, so Fetch should prefer an igchicago.org copy if one exists.'
