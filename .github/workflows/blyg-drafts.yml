# Phase 2: put each queued dossier (queue/drafts/<slug>-v<n>.md) into the Pothole Portolan Studio
# as a private draft. Never publishes: the supervisor reads the draft in the Studio and publishes it
# there. See scripts/blygger_client/push_drafts.py and docs/blygger.md.
#
# Supervisor-owned. The funnel's agent never sees the token: it lives only in this workflow, which
# runs no model.
#
# Triggers:
#   - after each funnel run (its commits are pushed with GITHUB_TOKEN, which does not trigger
#     push workflows, so workflow_run is the hook);
#   - on a push to main that changes queue/drafts/ (the supervisor's own edits);
#   - by hand, as a dry run by default;
#   - weekly, so the token reminder below runs even when no draft is waiting.
#
# Token reminder: every Studio credential ends within 30 days by the Studio's design, and no
# setting lengthens it. The token is a JWT, so each run reads its expiry date (without logging
# the token), and from 7 days before it opens one issue labelled studio-token with the steps.
#
# Setup (Settings, Secrets and variables, Actions):
#   secret   BLYGGER_DRAFT_TOKEN   Studio REST token (Studio, More, Client access, REST API) with
#                                  owner:read and owner:draft only. Expires after at most 30 days;
#                                  a 401 or 403 fails this job with renewal instructions.
#   variable BLYGGER_API_BASE      the Studio's API, for example https://pothole.example.org/api
#   variable BLYGGER_ARCHIVE_BASE  optional: a URL prefix that makes archive paths links, for
#                                  example https://github.com/patwater/pothole-portolan/blob/main/
# Until the secret and BLYGGER_API_BASE exist, every run says so and exits successfully.
name: blyg-drafts

on:
  workflow_run:
    workflows: [funnel]
    types: [completed]
  push:
    branches: [main]
    paths: ["queue/drafts/**"]
  schedule:
    - cron: "41 15 * * 3"   # Wednesdays, between the Monday and Thursday funnel runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and print the plan; send nothing to the Studio"
        type: boolean
        default: true

concurrency:
  group: blyg-drafts
  cancel-in-progress: false

permissions:
  contents: write   # commit ledger/blyg_items.yaml
  issues: write     # the token renewal reminder

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLYGGER_DRAFT_TOKEN: ${{ secrets.BLYGGER_DRAFT_TOKEN }}
      BLYGGER_API_BASE: ${{ vars.BLYGGER_API_BASE }}
      BLYGGER_ARCHIVE_BASE: ${{ vars.BLYGGER_ARCHIVE_BASE }}
      BLYGGER_TOKEN_STATUS_FILE: ${{ github.workspace }}/../token-status.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python3 -m pip install --quiet -r scripts/requirements.txt

      - name: Push changed drafts to the Studio
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$BLYGGER_API_BASE" ] || { [ "$DRY_RUN" != "true" ] && [ -z "$BLYGGER_DRAFT_TOKEN" ]; }; then
            echo "::notice title=Studio not configured::Set the BLYGGER_DRAFT_TOKEN secret and the BLYGGER_API_BASE variable to send drafts to the Studio. Nothing was sent."
            exit 0
          fi
          python3 -I -m unittest discover -s tests -p "test_blygger_client.py"
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 -I scripts/blygger_client/push_drafts.py "${args[@]}"

      - name: Open a reminder when the Studio token is about to expire
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          f="$BLYGGER_TOKEN_STATUS_FILE"
          [ -f "$f" ] || { echo "No token status (Studio not configured)."; exit 0; }
          renew="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["renew"])' "$f")"
          expires="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["expires"])' "$f")"
          if [ "$renew" != "True" ]; then echo "Token good until $expires."; exit 0; fi
          gh label create studio-token --description "Studio token renewal" --color D93F0B 2>/dev/null || true
          if [ -n "$(gh issue list --label studio-token --state open --limit 1 --json number --jq '.[0].number // empty')" ]; then
            echo "A renewal issue is already open."
            exit 0
          fi
          gh issue create --label studio-token --title "Renew the Studio token (expires $expires)" --body "The \`BLYGGER_DRAFT_TOKEN\` secret expires on **$expires**. Every Studio credential ends within 30 days by the Studio's design, so this comes round once a month.

          1. Sign in to the Studio at ${BLYGGER_API_BASE%/api}/studio (that exact address: a token works only at the address where it was created), and open More, then Client access.
          2. Create a REST API token named \`pothole-portolan blyg-drafts\` with only **owner:read** and **owner:draft**, and copy it.
          3. In this repository, open Settings, then Secrets and variables, then Actions, and update \`BLYGGER_DRAFT_TOKEN\`.
          4. Revoke the old token in Client access, then close this issue.

          Opened by the blyg-drafts workflow."

      - name: Commit the Studio item ledger
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- ledger/blyg_items.yaml)" ]; then
            echo "Ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git add ledger/blyg_items.yaml
          git commit -m "blyg-drafts: record Studio draft items" -m "Behavior: blyg-drafts workflow (no model). Sent changed queued drafts to the Studio as private drafts; nothing was published."
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push ledger/blyg_items.yaml"
          exit 1
